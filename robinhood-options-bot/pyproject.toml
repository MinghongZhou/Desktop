[project]
name = "robinhood-options-bot"
version = "0.1.0"
description = "Automated options trading bot for Robinhood with backtesting, risk controls, and observability."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "streamlit>=1.35",
    "plotly>=5.22",
    "requests>=2.31",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
