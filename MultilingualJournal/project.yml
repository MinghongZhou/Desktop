name: MultilingualJournal
options:
  bundleIdPrefix: com.minghongzhou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  MultilingualJournal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Resources/Info.plist
    info:
      path: Sources/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Multilingual Journal"
        NSMicrophoneUsageDescription: "Multilingual Journal uses the microphone to record your voice journal entries."
        NSSpeechRecognitionUsageDescription: "Multilingual Journal transcribes your voice entries on-device so you can journal by speaking in any language."
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.minghongzhou.MultilingualJournal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MultilingualJournalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MultilingualJournalTests
    dependencies:
      - target: MultilingualJournal
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.minghongzhou.MultilingualJournalTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  MultilingualJournal:
    build:
      targets:
        MultilingualJournal: all
        MultilingualJournalTests: [test]
    test:
      config: Debug
      targets:
        - MultilingualJournalTests
